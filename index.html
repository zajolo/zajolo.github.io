<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      font-size: 18px;
      font-family: monospace;
      border: 2px solid #00ffff;
      background: rgba(0,0,0,0.85);
      color: #00ffff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<button id="startButton">ACTIVATE TRANSMISSION</button>

<a-scene
  mindar-image="imageTargetSrc: ./invitation.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="hologramVideo"
      src="./cyberpunk_detective_transmission.webm"
      preload="auto"
      loop="false"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">

    <a-video
      id="hologramPlane"
      src="#hologramVideo"
      position="0 0 0.05"
      width="1.25"
      height="0.75"
      material="transparent: true; alphaTest: 0.01; side: double;">
    </a-video>

  </a-entity>

</a-scene>

<script>
  const scene = document.querySelector("a-scene");
  const startButton = document.querySelector("#startButton");
  const video = document.querySelector("#hologramVideo");
  const target = document.querySelector("#target");

  let activated = false;

  startButton.addEventListener("click", async () => {
    try {
      await scene.systems["mindar-image-system"].start();

      // Unlock media playback on mobile
      video.muted = true;
      await video.play();
      video.pause();
      video.currentTime = 0;
      video.muted = false;

      activated = true;
      startButton.style.display = "none";

    } catch (err) {
      console.error(err);
      alert("Camera or media playback could not start.");
    }
  });

  target.addEventListener("targetFound", async () => {
    if (!activated) return;

    video.currentTime = 0;

    try {
      await video.play();
    } catch (err) {
      console.error("Video playback failed:", err);
    }
  });

  target.addEventListener("targetLost", () => {
    video.pause();
    video.currentTime = 0;
  });

  video.addEventListener("ended", () => {
    video.pause();
    video.currentTime = 0;
  });
</script>

</body>
</html>
